name: Daily job hunt

on:
  schedule:
    # Two runs a day: morning (messages ~10:30 Europe/Istanbul) and evening (~17:00).
    # GitHub starts scheduled runs late: in Oct 2026 they started 5-7 hours late. So the early
    # slots start hours ahead and the first step waits until the slot's time (07:13 / 13:53 UTC;
    # İstanbul is UTC+3, no DST); a late start skips the wait. The later slots are backups;
    # --once-per-day --slot makes every run after the first one of a slot a no-op, and jobs.db
    # keeps the evening run from resending ads the morning run already sent.
    # The evening crons must match EVENING_CRONS in the wait step below.
    - cron: "41 1 * * *"   # morning, 04:41 İstanbul, waits until 10:13
    - cron: "47 3 * * *"   # morning, 06:47 İstanbul, waits until 10:13
    - cron: "23 7 * * *"   # morning backup, 10:23 İstanbul
    - cron: "17 9 * * *"   # morning backup, 12:17 İstanbul
    - cron: "37 8 * * *"   # evening, 11:37 İstanbul, waits until 16:53
    - cron: "43 10 * * *"  # evening, 13:43 İstanbul, waits until 16:53
    - cron: "7 14 * * *"   # evening backup, 17:07 İstanbul
    - cron: "11 16 * * *"  # evening backup, 19:11 İstanbul
  workflow_dispatch:
    inputs:
      mode:
        description: "check = Telegram/AI bağlantı testi, dry_run = gönderim yok, normal = gerçek çalıştırma"
        type: choice
        options: [check, dry_run, normal]
        default: check

permissions:
  contents: read

defaults:
  run:
    shell: bash  # also on a Windows self-hosted runner (Git Bash)

jobs:
  hunt:
    # Kariyer.net, Indeed and Yenibiriş block GitHub's data-centre IPs (2026-10-19), LinkedIn does not.
    # With the repo variable SELF_HOSTED_RUNNER=true the Turkish sites run on the user's own computer
    # (a self-hosted runner, home internet) and LinkedIn stays on GitHub. Without it, everything runs here.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.SELF_HOSTED_RUNNER == 'true' && '[{"name":"cloud","runner":"ubuntu-latest","sources":"linkedin","label":"LinkedIn"},{"name":"local","runner":"self-hosted","sources":"kariyernet,indeed,yenibiris,secretcv","label":"Türk siteleri"}]' || '[{"name":"cloud","runner":"ubuntu-latest","sources":"","label":""}]') }}
    name: hunt (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 360  # up to ~5.5 h of waiting for the slot's time + the run itself
    concurrency:
      group: daily-job-hunt-${{ matrix.target.name }}
      cancel-in-progress: false
    env:
      TZ: Europe/Istanbul  # date.today() must be the Turkish calendar day
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CV_MD: ${{ secrets.CV_MD }}
      CV_MD_B64: ${{ secrets.CV_MD_B64 }}
      TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
      AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'groq' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GROQ_MODEL_STRONG: ${{ vars.GROQ_MODEL_STRONG }}
      AI_DELAY_S: "3"      # pause between Groq calls (free-tier rate limit)
      SAVE_RAW_HTML: "true" # keep list pages in the output artifact for debugging
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      SOURCES: ${{ matrix.target.sources }}
      RUN_LABEL: ${{ matrix.target.label }}
    steps:
      - name: Pick the slot and wait for its time
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENING_CRONS: "37 8 * * *|43 10 * * *|7 14 * * *|11 16 * * *"
        run: |
          if [ -n "$SCHEDULE" ]; then
            case "|$EVENING_CRONS|" in *"|$SCHEDULE|"*) slot=evening ;; *) slot=morning ;; esac
          elif [ "$(date -u +%H)" -lt 13 ]; then slot=morning; else slot=evening; fi
          echo "SLOT=$slot" >> "$GITHUB_ENV"
          if [ "$slot" = evening ]; then echo "RUN_LABEL=akşam${RUN_LABEL:+ · $RUN_LABEL}" >> "$GITHUB_ENV"; fi
          if [ -z "$SCHEDULE" ]; then exit 0; fi
          if [ "$slot" = evening ]; then at=13:53; else at=07:13; fi
          target=$(date -u -d "$(date -u +%F) $at" +%s)
          wait=$(( target - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "Waiting $(( wait / 60 )) min until $at UTC ($slot)"
            sleep "$wait"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: data/
          key: jobs-data-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: |
            jobs-data-${{ matrix.target.name }}-

      - name: Run job hunter
        run: |
          mkdir -p data output
          SRC=()
          if [ -n "$SOURCES" ]; then SRC=(--sources "$SOURCES"); fi
          case "$MODE" in
            check)   python -m src.main --check ;;
            dry_run) python -m src.main --dry-run "${SRC[@]}" ;;
            *)       python -m src.main --once-per-day --slot "$SLOT" "${SRC[@]}" ;;
          esac

      - name: Show report on the run page
        if: always()
        run: |
          for f in output/*/report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.target.name }}-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
