name: Daily job hunt

on:
  schedule:
    - cron: "30 7 * * *"  # 07:30 UTC = 10:30 Europe/Istanbul (UTC+3, no DST)
  workflow_dispatch:
    inputs:
      mode:
        description: "check = Telegram/AI bağlantı testi, dry_run = gönderim yok, normal = gerçek çalıştırma"
        type: choice
        options: [check, dry_run, normal]
        default: check

permissions:
  contents: read

concurrency:
  group: daily-job-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul  # date.today() must be the Turkish calendar day
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CV_MD: ${{ secrets.CV_MD }}
      CV_MD_B64: ${{ secrets.CV_MD_B64 }}
      TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
      AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'groq' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GROQ_MODEL_STRONG: ${{ vars.GROQ_MODEL_STRONG }}
      AI_DELAY_S: "3"      # pause between Groq calls (free-tier rate limit)
      SAVE_RAW_HTML: "true" # keep list pages in the output artifact for debugging
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run job hunter
        run: |
          mkdir -p data output
          case "$MODE" in
            check)   python -m src.main --check ;;
            dry_run) python -m src.main --dry-run ;;
            *)       python -m src.main ;;
          esac

      - name: Show report on the run page
        if: always()
        run: |
          for f in output/*/report.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
