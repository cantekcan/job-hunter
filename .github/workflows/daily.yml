name: Daily job hunt

on:
  schedule:
    # Two runs a day: morning (messages ~10:30 Europe/Istanbul) and evening (~17:00).
    # GitHub starts scheduled runs very late (5-7 h in Oct 2026, 6.5 h and more in Nov), so the
    # early crons fire ~12 h ahead and the run waits (jobs wait1-3, up to ~17 h) until the slot's
    # time: 07:13 / 13:53 UTC (İstanbul is UTC+3, no DST). A run that starts after that time,
    # but less than 10 h after it, runs at once. The backup crons cover a dropped early cron;
    # --once-per-day --slot makes every run after the first one of a slot a no-op, and jobs.db
    # keeps the evening run from resending ads the morning run already sent.
    # The evening crons must match EVENING_CRONS in the plan job below.
    - cron: "41 19 * * *"  # morning, 22:41 İstanbul the evening before
    - cron: "47 23 * * *"  # morning, 02:47 İstanbul
    - cron: "23 7 * * *"   # morning backup, 10:23 İstanbul
    - cron: "37 2 * * *"   # evening, 05:37 İstanbul
    - cron: "43 5 * * *"   # evening, 08:43 İstanbul
    - cron: "7 14 * * *"   # evening backup, 17:07 İstanbul
  workflow_dispatch:
    inputs:
      mode:
        description: "check = Telegram/AI bağlantı testi, dry_run = gönderim yok, normal = gerçek çalıştırma"
        type: choice
        options: [check, dry_run, normal]
        default: check

permissions:
  contents: read

defaults:
  run:
    shell: bash  # also on a Windows self-hosted runner (Git Bash)

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.plan.outputs.slot }}
      target: ${{ steps.plan.outputs.target }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Pick the slot and its start time
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENING_CRONS: "37 2 * * *|43 5 * * *|7 14 * * *"
        run: |
          if [ -n "$SCHEDULE" ]; then
            case "|$EVENING_CRONS|" in *"|$SCHEDULE|"*) slot=evening ;; *) slot=morning ;; esac
          elif [ "$(date -u +%H)" -lt 13 ]; then slot=morning; else slot=evening; fi
          target=0  # 0 = start now (manual runs, late scheduled runs)
          if [ -n "$SCHEDULE" ]; then
            if [ "$slot" = evening ]; then at=13:53; else at=07:13; fi
            now=$(date -u +%s)
            t=$(date -u -d "$(date -u +%F) $at" +%s)
            if [ $(( t - now )) -lt -36000 ]; then t=$(( t + 86400 )); fi  # >10 h past: next day's slot
            if [ "$t" -gt "$now" ]; then target=$t; fi
            # A backup that starts so late it is already the next day in İstanbul would use up
            # that day's slot (2026-11-03: the evening backup ran at 01:44 and the real evening
            # run became a no-op), so it is dropped instead.
            if [ "$(TZ=Europe/Istanbul date -d "@$now" +%F)" != "$(TZ=Europe/Istanbul date -d "@$t" +%F)" ] \
               && [ "$target" = 0 ]; then
              echo "Started too late for the $slot slot of $(TZ=Europe/Istanbul date -d "@$t" +%F); skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Slot $slot, start at $( [ "$target" = 0 ] && echo now || date -u -d "@$target" )"

  # A job may run at most 6 h, so the wait is split over three jobs.
  wait1:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait
        env: { TARGET: "${{ needs.plan.outputs.target }}" }
        run: |
          left=$(( TARGET - $(date -u +%s) ))
          if [ "$TARGET" -gt 0 ] && [ "$left" -gt 0 ]; then
            chunk=$(( left < 20700 ? left : 20700 ))  # 5 h 45 min
            echo "Waiting $(( chunk / 60 )) of $(( left / 60 )) min"
            sleep "$chunk"
          fi
  wait2:
    needs: [plan, wait1]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait
        env: { TARGET: "${{ needs.plan.outputs.target }}" }
        run: |
          left=$(( TARGET - $(date -u +%s) ))
          if [ "$TARGET" -gt 0 ] && [ "$left" -gt 0 ]; then
            chunk=$(( left < 20700 ? left : 20700 ))  # 5 h 45 min
            echo "Waiting $(( chunk / 60 )) of $(( left / 60 )) min"
            sleep "$chunk"
          fi
  wait3:
    needs: [plan, wait2]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait
        env: { TARGET: "${{ needs.plan.outputs.target }}" }
        run: |
          left=$(( TARGET - $(date -u +%s) ))
          if [ "$TARGET" -gt 0 ] && [ "$left" -gt 0 ]; then
            chunk=$(( left < 20700 ? left : 20700 ))  # 5 h 45 min
            echo "Waiting $(( chunk / 60 )) of $(( left / 60 )) min"
            sleep "$chunk"
          fi

  hunt:
    needs: [plan, wait3]
    if: needs.plan.outputs.skip != 'true'
    # Kariyer.net, Indeed and Yenibiriş block GitHub's data-centre IPs (2026-10-19), LinkedIn does not.
    # With the repo variable SELF_HOSTED_RUNNER=true the Turkish sites run on the user's own computer
    # (a self-hosted runner, home internet) and LinkedIn stays on GitHub. Without it, everything runs here.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(vars.SELF_HOSTED_RUNNER == 'true' && '[{"name":"cloud","runner":"ubuntu-latest","sources":"linkedin","label":"LinkedIn"},{"name":"local","runner":"self-hosted","sources":"kariyernet,indeed,yenibiris,secretcv","label":"Türk siteleri"}]' || '[{"name":"cloud","runner":"ubuntu-latest","sources":"","label":""}]') }}
    name: hunt (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    concurrency:
      group: daily-job-hunt-${{ matrix.target.name }}
      cancel-in-progress: false
    env:
      TZ: Europe/Istanbul  # date.today() must be the Turkish calendar day
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CV_MD: ${{ secrets.CV_MD }}
      CV_MD_B64: ${{ secrets.CV_MD_B64 }}
      TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
      AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'groq' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GROQ_MODEL_STRONG: ${{ vars.GROQ_MODEL_STRONG }}
      AI_DELAY_S: "3"      # pause between Groq calls (free-tier rate limit)
      SAVE_RAW_HTML: "true" # keep list pages in the output artifact for debugging
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      SOURCES: ${{ matrix.target.sources }}
      RUN_LABEL: ${{ matrix.target.label }}
      SLOT: ${{ needs.plan.outputs.slot }}
    steps:
      - name: Label the evening run
        if: needs.plan.outputs.slot == 'evening'
        run: echo "RUN_LABEL=akşam${RUN_LABEL:+ · $RUN_LABEL}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: data/
          key: jobs-data-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: |
            jobs-data-${{ matrix.target.name }}-

      - name: Run job hunter
        run: |
          mkdir -p data output
          SRC=()
          if [ -n "$SOURCES" ]; then SRC=(--sources "$SOURCES"); fi
          case "$MODE" in
            check)   python -m src.main --check ;;
            dry_run) python -m src.main --dry-run "${SRC[@]}" ;;
            *)  # a manual normal run always runs; jobs.db still keeps sent ads from repeating
              if [ "${{ github.event_name }}" = workflow_dispatch ]; then python -m src.main "${SRC[@]}"
              else python -m src.main --once-per-day --slot "$SLOT" "${SRC[@]}"; fi ;;
          esac

      - name: Show report on the run page
        if: always()
        run: |
          for f in output/*/report.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.target.name }}-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
